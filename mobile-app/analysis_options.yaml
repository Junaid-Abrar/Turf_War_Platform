# Static analysis configuration for the Turf War mobile app.
#
# Builds on `flutter_lints` with a stricter set: production code must not use
# `print`, must not reach across async gaps with a BuildContext, and must be
# const-correct so widget rebuilds stay cheap.

include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # These are the rules that caused real bugs in this codebase before the
    # Phase 4 refactor — treat them as build failures, not suggestions.
    avoid_print: error
    use_build_context_synchronously: error
    unawaited_futures: error
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    - avoid_print
    - use_build_context_synchronously
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_const_literals_to_create_immutables
    - require_trailing_commas
    - prefer_final_locals
    - unawaited_futures
    - always_declare_return_types
    - avoid_unnecessary_containers
    - sized_box_for_whitespace
    - use_super_parameters
